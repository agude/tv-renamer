[project]
name = "tv-renamer"
dynamic = ["version"]
description = "CLI tool for renaming and organizing TV media files for Jellyfin"
requires-python = ">=3.10"
readme = "README.md"
license = {file = "LICENSE.md"}
dependencies = [
    "requests>=2.31",
]

[project.scripts]
tv-renamer = "tv_renamer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# Version has one home: the package's __init__.py. Nothing else stores it,
# so nothing else can disagree with it.
path = "src/tv_renamer/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tv_renamer"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.16",
    "mypy>=1.15",
]

[tool.ruff]
# Match requires-python.
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "PTH",    # flake8-use-pathlib
]
ignore = [
    "E501",   # line too long (handled by the formatter)
]

[tool.mypy]
python_version = "3.10"
strict = true
# Required with a src/ layout and no tests/__init__.py: without them mypy
# resolves tests/test_x.py as top-level `test_x`, so the `tests.*` override
# below silently never matches. mypy_path stops the package being discovered
# twice (as src.pkg and pkg), which is a hard error.
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests", "tests.*"]
# Test bodies are the assertion; annotating every fixture buys nothing.
# disallow_untyped_calls follows it, or typed tests calling untyped helpers
# re-report the same noise under a different code.
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage gate at 60% during scaffolding; will ratchet up as more tests land.
addopts = "--cov=tv_renamer --cov-fail-under=60"
